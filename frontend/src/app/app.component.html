<main class="shell" [class.stage-chat]="currentStage === 'chat'">
  <header class="topbar">
    <div class="secure-pill"><span></span> End-to-End Encrypted</div>
  </header>

  <!-- Stage 1: Room Unlock Screen -->
  @if (currentStage === 'unlock') {
    <app-unlock (unlocked)="onUnlocked($event)"></app-unlock>
  }

  <!-- Stage 2: Identity / Role Selection Screen -->
  @if (currentStage === 'role') {
    <app-role-select
      [roomId]="activeRoomId"
      (roleJoined)="onRoleJoined($event)"
    ></app-role-select>
  }

  <!-- Stage 3: Active Chat Room Screen -->
  @if (currentStage === 'chat' && encryptionKey && myRole) {
    <app-chat-room
      [roomId]="activeRoomId"
      [myRole]="myRole"
      [encryptionKey]="encryptionKey"
      [initialData]="joinRoomData"
      (leave)="onLeaveChat()"
    ></app-chat-room>
  }

  <!-- WebRTC Audio/Video Call Overlay -->
  <app-call-modal></app-call-modal>

  @if (currentStage !== 'chat') {
    <footer>Encrypted Chat <span>•</span> Cloud Persistent Storage</footer>
  }
</main>
