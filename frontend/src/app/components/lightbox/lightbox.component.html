@if (show) {
  <div class="attachment-lightbox-overlay" (click)="onClose()">
    <div class="attachment-lightbox-topbar" (click)="$event.stopPropagation()">
      <div class="attachment-lightbox-title">{{ title || 'Photo' }}</div>
      <div class="attachment-lightbox-actions">
        <!-- Zoom Out Button -->
        <button
          type="button"
          class="attachment-lightbox-zoom-btn"
          title="Zoom Out"
          (click)="zoomOut()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>

        <!-- Reset Zoom (shows current zoom percentage) -->
        <button
          type="button"
          class="attachment-lightbox-zoom-btn zoom-level-badge"
          title="Reset Zoom & Position"
          (click)="resetZoom()"
        >
          {{ Math.round(zoomLevel * 100) }}%
        </button>

        <!-- Zoom In Button -->
        <button
          type="button"
          class="attachment-lightbox-zoom-btn"
          title="Zoom In"
          (click)="zoomIn()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>

        <!-- Close Button -->
        <button
          type="button"
          class="attachment-lightbox-close-btn"
          title="Close Viewer"
          (click)="onClose()"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Lightbox Image Viewport with Pan/Zoom & Swipe -->
    <div class="attachment-lightbox-body" (click)="onClose()">
      <div
        class="attachment-lightbox-stage"
        (click)="$event.stopPropagation()"
      >
        <img
          class="attachment-lightbox-img"
          [class.is-dragging]="isDragging"
          [src]="imageUrl"
          [alt]="title || 'Photo'"
          [style.transform]="'translate3d(' + panX + 'px, ' + panY + 'px, 0px) scale(' + zoomLevel + ')'"
          [style.cursor]="zoomLevel > 1 ? (isDragging ? 'grabbing' : 'grab') : 'zoom-in'"
          (mousedown)="onMouseDown($event)"
          (touchstart)="onTouchStart($event)"
          (touchmove)="onTouchMove($event)"
          (touchend)="onTouchEnd($event)"
          (click)="onImageClick($event)"
          (wheel)="onWheel($event)"
          draggable="false"
        />
      </div>
    </div>
  </div>
}
